<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homelab Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='5' width='26' height='6' rx='2' fill='%23116a67'/><rect x='3' y='13' width='26' height='6' rx='2' fill='%23116a67' opacity='.7'/><rect x='3' y='21' width='26' height='6' rx='2' fill='%23116a67' opacity='.45'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="brand-logo" data-brand-logo><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="5" width="26" height="6" rx="2" style="fill:var(--accent)"/>
        <rect x="3" y="13" width="26" height="6" rx="2" style="fill:var(--accent)" opacity=".7"/>
        <rect x="3" y="21" width="26" height="6" rx="2" style="fill:var(--accent)" opacity=".45"/>
        <circle cx="24" cy="8" r="1.4" style="fill:var(--surface)"/><circle cx="24" cy="16" r="1.4" style="fill:var(--surface)"/><circle cx="24" cy="24" r="1.4" style="fill:var(--surface)"/>
      </svg></span>
      <div><b data-brand-name>Homelab Monitor</b><span id="ver">v1.0.0</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me" id="me"></div>
      <div class="seg" id="theme" role="group" aria-label="Tema">
        <button data-t="light">Claro</button><button data-t="dark">Escuro</button><button data-t="system">Sistema</button>
      </div>
      <span class="small muted" id="poll"></span>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menu" aria-label="Abrir menu">☰</button>
      <div class="chips" id="hostchips"></div>
      <div class="top-right">
        <div class="seg" id="range" role="group" aria-label="Período">
          <button data-r="1h">1h</button><button data-r="6h">6h</button><button data-r="24h">24h</button><button data-r="7d">7d</button><button data-r="30d">30d</button>
        </div>
        <label class="toggle"><input type="checkbox" id="auto" checked> Atualizar sozinho</label>
        <span class="stamp" id="stamp">carregando…</span>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="tip" id="tip"></div>
<dialog id="dlg" aria-label="Serviço"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="branding.js"></script>
<script src="diagram.js"></script>
<script src="assistant.js"></script>
<script src="launcher.js"></script>
<script src="security.js"></script>
<script src="app.js"></script>
<script src="proxmox.js"></script>
<script src="pages.js"></script>
</body>
</html>
